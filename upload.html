<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSV Data Analyzer - Professional Upload</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #7e22ce 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            animation: slideIn 0.5s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .header {
            text-align: center;
            margin-bottom: 35px;
        }
        
        .header h1 {
            color: #1e293b;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        
        .header p {
            color: #64748b;
            font-size: 15px;
        }
        
        .upload-area {
            border: 3px dashed #cbd5e1;
            border-radius: 16px;
            padding: 50px 30px;
            text-align: center;
            background: #f8fafc;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .upload-area:hover {
            border-color: #3b82f6;
            background: #eff6ff;
        }
        
        .upload-area.dragover {
            border-color: #3b82f6;
            background: #dbeafe;
            transform: scale(1.02);
        }
        
        .upload-area.file-selected {
            border-color: #10b981;
            background: linear-gradient(135deg, #d1fae5 0%, #a7f3d0 100%);
        }
        
        .upload-icon {
            font-size: 64px;
            margin-bottom: 20px;
            transition: transform 0.3s ease;
        }
        
        .upload-area:hover .upload-icon {
            transform: scale(1.1);
        }
        
        .upload-text h3 {
            color: #334155;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        .upload-text p {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 12px;
        }
        
        .file-types {
            color: #94a3b8;
            font-size: 13px;
            margin-top: 8px;
        }
        
        #csvFile {
            display: none;
        }
        
        .file-info {
            display: none;
            margin-top: 20px;
            padding: 16px;
            background: white;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }
        
        .file-info.active {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .file-icon {
            font-size: 40px;
        }
        
        .file-details {
            flex: 1;
            text-align: left;
        }
        
        .file-name {
            color: #1e293b;
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 4px;
            word-break: break-word;
        }
        
        .file-size {
            color: #64748b;
            font-size: 13px;
        }
        
        .remove-file {
            background: #fee2e2;
            color: #dc2626;
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .remove-file:hover {
            background: #fecaca;
        }
        
        .button-group {
            margin-top: 30px;
            display: flex;
            gap: 12px;
        }
        
        button {
            flex: 1;
            padding: 16px 24px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }
        
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.5);
        }
        
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .btn-secondary {
            background: #f1f5f9;
            color: #475569;
        }
        
        .btn-secondary:hover {
            background: #e2e8f0;
        }
        
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .error-message {
            display: none;
            margin-top: 15px;
            padding: 12px 16px;
            background: #fee2e2;
            color: #dc2626;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
        }
        
        .error-message.active {
            display: block;
            animation: shake 0.5s;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        
        .success-message {
            display: none;
            margin-top: 15px;
            padding: 12px 16px;
            background: #d1fae5;
            color: #065f46;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
        }
        
        .success-message.active {
            display: block;
        }
        
        #dashboardContainer {
            margin-top: 40px;
            width: 100%;
        }
        
        @media (max-width: 640px) {
            .container {
                padding: 30px 20px;
            }
            
            .header h1 {
                font-size: 24px;
            }
            
            .upload-area {
                padding: 40px 20px;
            }
            
            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="header">
            <h1>📊 CSV Data Analyzer</h1>
            <p>Upload your CSV file to generate insights and visualizations</p>
        </div>

        <div class="upload-area" id="uploadArea" onclick="document.getElementById('csvFile').click()">
            <div class="upload-icon">📁</div>
            <div class="upload-text">
                <h3>Drag & Drop CSV File</h3>
                <p>or <strong>click to browse</strong></p>
                <div class="file-types">Supported format: .csv</div>
            </div>
            
            <div class="file-info" id="fileInfo">
                <div class="file-icon">📄</div>
                <div class="file-details">
                    <div class="file-name" id="fileName"></div>
                    <div class="file-size" id="fileSize"></div>
                </div>
                <button class="remove-file" onclick="event.stopPropagation(); removeFile();" title="Remove file">×</button>
            </div>
        </div>
        
        <input type="file" id="csvFile" accept=".csv" onchange="handleFileSelect(event)" />
        
        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>
        
        <div class="button-group">
            <button class="btn-secondary" onclick="removeFile()">Clear</button>
            <button class="btn-primary" id="analyzeBtn" onclick="analyzeCSV()" disabled>
                <span id="btnText">Analyze Data</span>
                <div class="spinner" id="spinner" style="display: none;"></div>
            </button>
        </div>
    </div>

    <div id="dashboardContainer"></div>

    <script>
        let selectedFile = null;
        
        // Initialize drag and drop
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('csvFile');
        const fileInfo = document.getElementById('fileInfo');
        const analyzeBtn = document.getElementById('analyzeBtn');
        
        // Prevent default drag behaviors
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            uploadArea.addEventListener(eventName, preventDefaults, false);
            document.body.addEventListener(eventName, preventDefaults, false);
        });
        
        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }
        
        // Highlight drop area when item is dragged over it
        ['dragenter', 'dragover'].forEach(eventName => {
            uploadArea.addEventListener(eventName, () => {
                uploadArea.classList.add('dragover');
            }, false);
        });
        
        ['dragleave', 'drop'].forEach(eventName => {
            uploadArea.addEventListener(eventName, () => {
                uploadArea.classList.remove('dragover');
            }, false);
        });
        
        // Handle dropped files
        uploadArea.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            const files = dt.files;
            
            if (files.length > 0) {
                fileInput.files = files;
                handleFileSelect({ target: fileInput });
            }
        }, false);
        
        function handleFileSelect(event) {
            const file = event.target.files[0];
            hideMessages();
            
            if (!file) {
                return;
            }
            
            // Validate file type
            if (!file.name.toLowerCase().endsWith('.csv')) {
                showError('Please select a valid CSV file');
                fileInput.value = '';
                return;
            }
            
            // Validate file size (max 50MB)
            const maxSize = 50 * 1024 * 1024;
            if (file.size > maxSize) {
                showError('File size exceeds 50MB limit');
                fileInput.value = '';
                return;
            }
            
            selectedFile = file;
            displayFileInfo(file);
            analyzeBtn.disabled = false;
            uploadArea.classList.add('file-selected');
        }
        
        function displayFileInfo(file) {
            const fileName = document.getElementById('fileName');
            const fileSize = document.getElementById('fileSize');
            
            fileName.textContent = file.name;
            fileSize.textContent = formatFileSize(file.size);
            
            fileInfo.classList.add('active');
        }
        
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }
        
        function removeFile() {
            selectedFile = null;
            fileInput.value = '';
            fileInfo.classList.remove('active');
            uploadArea.classList.remove('file-selected');
            analyzeBtn.disabled = true;
            hideMessages();
        }
        
        function showError(message) {
            const errorMsg = document.getElementById('errorMessage');
            errorMsg.textContent = message;
            errorMsg.classList.add('active');
            
            setTimeout(() => {
                errorMsg.classList.remove('active');
            }, 5000);
        }
        
        function showSuccess(message) {
            const successMsg = document.getElementById('successMessage');
            successMsg.textContent = message;
            successMsg.classList.add('active');
        }
        
        function hideMessages() {
            document.getElementById('errorMessage').classList.remove('active');
            document.getElementById('successMessage').classList.remove('active');
        }
        
        async function analyzeCSV() {
            if (!selectedFile) {
                showError('Please select a CSV file first');
                return;
            }
            
            hideMessages();
            
            // Show loading state
            const btnText = document.getElementById('btnText');
            const spinner = document.getElementById('spinner');
            analyzeBtn.disabled = true;
            btnText.textContent = 'Analyzing...';
            spinner.style.display = 'block';
            
            try {
                const formData = new FormData();
                formData.append("datafile", selectedFile);

                const response = await fetch("https://danny-supercrowned-shawnda.ngrok-free.dev/webhook-test/upload", {
                    method: "POST",
                    body: formData
                });

                if (!response.ok) {
                    throw new Error(`Server error: ${response.status}`);
                }

                const result = await response.json();
                
                if (result.html) {
                    showSuccess('Analysis complete! Loading dashboard...');
                    
                    // Small delay to show success message
                    setTimeout(() => {
                        document.open();
                        document.write(result.html);
                        document.close();
                    }, 500);
                } else {
                    throw new Error('Invalid response from server');
                }
                
            } catch (error) {
                console.error('Error:', error);
                showError('Failed to analyze CSV. Please check your file and try again.');
                
                // Reset button state
                btnText.textContent = 'Analyze Data';
                spinner.style.display = 'none';
                analyzeBtn.disabled = false;
            }
        }
    </script>


</body>

</html>
